<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DecoBot AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

   body {
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .chat-container {
      width: 680px;
      height: 85vh;
      min-height: 500px;
      max-height: 800px;
      background: #1a1a2e;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.15);
      overflow: hidden;
      border: 1px solid rgba(0, 200, 255, 0.1);
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #0f3460, #16213e);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 200, 255, 0.2);
    }

    .chat-header h1 {
      color: #00c8ff;
      font-size: 22px;
      letter-spacing: 2px;
    }

    .chat-header p {
      color: #8892b0;
      font-size: 12px;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ff88;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .status span {
      color: #00ff88;
      font-size: 11px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #00c8ff33;
      border-radius: 10px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .message.bot {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
    }

    .message-label {
      font-size: 10px;
      margin-bottom: 4px;
      color: #8892b0;
      letter-spacing: 1px;
    }

    .message.user .message-label {
      text-align: right;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.bot .message-bubble {
      background: #0f3460;
      color: #e0e0e0;
      border-top-left-radius: 4px;
      border-left: 2px solid #00c8ff;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, #00c8ff, #0077ff);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .message-time {
      font-size: 10px;
      color: #8892b0;
      margin-top: 4px;
    }

    .message.user .message-time {
      text-align: right;
    }

    /* Source badge */
    .source-badge {
      display: inline-block;
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .source-badge.rule {
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      border: 1px solid rgba(0, 255, 136, 0.3);
    }

    .source-badge.ai {
      background: rgba(0, 200, 255, 0.1);
      color: #00c8ff;
      border: 1px solid rgba(0, 200, 255, 0.3);
    }

    /* Typing indicator */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: #0f3460;
      padding: 12px 16px;
      border-radius: 16px;
      border-top-left-radius: 4px;
      border-left: 2px solid #00c8ff;
    }

    .typing-indicator span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00c8ff;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0);    }
      50%       { transform: translateY(-6px); }
    }

    /* Input area */
    .chat-input {
      padding: 16px;
      background: #16213e;
      border-top: 1px solid rgba(0, 200, 255, 0.1);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input input {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 25px;
      padding: 12px 18px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border 0.3s;
    }

    .chat-input input:focus {
      border-color: #00c8ff;
    }

    .chat-input input::placeholder {
      color: #8892b0;
    }

    .send-btn {
      background: linear-gradient(135deg, #00c8ff, #0077ff);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.4);
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    /* Footer */
    .chat-footer {
      text-align: center;
      padding: 8px;
      background: #16213e;
      color: #8892b0;
      font-size: 10px;
      letter-spacing: 1px;
      border-top: 1px solid rgba(0, 200, 255, 0.1);
    }
  </style>
</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <h1>🤖 DECOBOT AI</h1>
    <p>Rule-Based Intelligence Engine | DecodeLabs 2026</p>
    <div class="status">
      <div class="status-dot"></div>
      <span>ONLINE — All Systems Operational</span>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      <div class="message-label">🤖 DECOBOT</div>
      <div class="message-bubble">
        Hey there! I'm DecoBot 👋<br/>
        Type <b>help</b> to see what I can do!
      </div>
      <div class="source-badge rule">RULE</div>
      <div class="message-time">Just now</div>
    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input">
    <input
      type="text"
      id="userInput"
      placeholder="Type a message..."
      autocomplete="off"
    />
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>

  <!-- Footer -->
  <div class="chat-footer">
    POWERED BY DECODELABS — BATCH 2026
  </div>

</div>

<script>
  const chatMessages = document.getElementById("chatMessages");
  const userInput    = document.getElementById("userInput");
  const typing       = document.getElementById("typingIndicator");

  // Send on Enter key
  userInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
  });

  function getCurrentTime() {
    return new Date().toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function appendMessage(sender, text, time, source = null) {
    chatMessages.removeChild(typing);

    const msg = document.createElement("div");
    msg.classList.add("message", sender);

    const label = sender === "bot" ? "🤖 DECOBOT" : "🧑 YOU";

    // Source badge for bot messages
    const badgeHTML = source
      ? `<div class="source-badge ${source}">${source.toUpperCase()}</div>`
      : "";

    msg.innerHTML = `
      <div class="message-label">${label}</div>
      <div class="message-bubble">${text}</div>
      ${badgeHTML}
      <div class="message-time">${time}</div>
    `;

    chatMessages.appendChild(msg);
    chatMessages.appendChild(typing);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showTyping() {
    typing.style.display = "block";
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function hideTyping() {
    typing.style.display = "none";
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const time = getCurrentTime();

    // Show user message
    appendMessage("user", text, time);
    userInput.value = "";

    // Show typing indicator
    showTyping();

    try {
      // Send to Flask backend
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();

      // Small delay for realistic feel
      setTimeout(() => {
        hideTyping();
        appendMessage("bot", data.response, data.timestamp, data.source);
      }, 800);

    } catch (error) {
      setTimeout(() => {
        hideTyping();
        appendMessage("bot", "Connection error! Make sure the server is running.", getCurrentTime(), "rule");
      }, 800);
    }
  }
</script>

</body>
</html>
